spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/testinsight
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Directory for storing Cucumber screenshots and attachments
testinsight.storage.attachments-directory=./storage/attachments

# Directory for storing original Cucumber JSON reports
testinsight.storage.reports-directory=./storage/reports