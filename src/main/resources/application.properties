spring.applicationEntity.name=backend

# Moet ook hier aanwezig zijn, anders werkt het niet in "productie" modus.
testinsight.storage.attachments-directory=./storage/attachments

spring.datasource.url=jdbc:h2:mem:testinsight
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=abc123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Use Jackson 3 for Hibernate JSON serialization and deserialization
spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.Jackson3JsonFormatMapper